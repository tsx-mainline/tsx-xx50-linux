# /etc/tsx/panel-app-board.conf: the board part of the panel app service
# (tsx-panel-app-run of tsx-linux-common reads it after
# /etc/tsx/panel-app.conf). Shell syntax.

# The program draws with tsx_drm (DRM/KMS on card0) and reads the touch and
# the keys with tsx_evdev. The snapshot folder is a test aid:
# `touch /run/tsx/panel-app/app/snapshot` (root, the app runs as a user) or
# `touch /run/tsx/panel-app.snapshot` (the app runs as root) saves the
# screen there.
PANEL_APP_ENV="ESPHOME_SNAPSHOT_DIR=/tmp/panel-app-snapshots"
PANEL_APP_DIRS="/tmp/panel-app-snapshots"
# The display.
PANEL_APP_DEVICES="/dev/dri/card0"
PANEL_APP_WAIT=60
# The light bars (TLC59116, the LED class devices). The program writes them
# as the user tsx-panel-app: the service gives that group write access to
# their brightness and multi_intensity files.
PANEL_APP_LEDS="rgb:lightbar-*"
