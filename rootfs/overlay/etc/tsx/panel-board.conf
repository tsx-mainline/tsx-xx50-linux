# /etc/tsx/panel-board.conf: the values of the xx50 board (shell syntax).
# The shared services read it after their own defaults (docs/layout.md of
# tsx-linux-common). A value in panel.conf still wins.

# Backlight steps of /sys/class/backlight (pwm-backlight, 0..255).
BACKLIGHT_MAX=255
BACKLIGHT_MIN=10
BRIGHTNESS_DAY=255
BRIGHTNESS_NIGHT=60

# CPU speed. The board service tsx-cpufreq sets the governor and its
# settings at boot. The panel app (tsx_cards, docs/panel-app.md of
# tsx-linux-common, "CPU speed") sets the frequency limits:
#  - CPUFREQ_BOOST_MS: after each touch, key press, redraw burst and wake,
#    the CPU runs at 1 GHz for this time. Then ondemand scales it down (to
#    167 MHz when the app is idle).
#  - CPUFREQ_SCREEN_OFF=lowest: 167 MHz only while the screen is off.
# ondemand alone stays at 333 to 400 MHz for the short bursts of the app
# with up_threshold 95 (the kernel default): up_threshold 40 lets a longer
# burst (an update from Home Assistant) reach 1 GHz after one 20 ms sample
# (the shortest sampling rate at HZ=100). CPUFREQ_AWAKE=performance gives a
# fixed 1 GHz (as the factory firmware) and makes the app limits of no use.
CPUFREQ_AWAKE=ondemand
CPUFREQ_UP_THRESHOLD=40
CPUFREQ_SAMPLING_RATE=20000
CPUFREQ_BOOST_MS=1500
CPUFREQ_SCREEN_OFF=lowest

# Touch controller (FT5x06): the board service tsx-touch keeps it in its
# active scan mode, as the factory driver did. In its own default it goes to
# a slow "monitor" scan after some time with no touch, and a short tap on a
# dark screen can be lost. yes / no.
TOUCH_ALWAYS_ACTIVE=yes
