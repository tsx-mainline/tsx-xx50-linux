# /etc/tsx/buttons-board.conf: the front keys of the TSS-752 (board layer of tsx-buttons)
# tsx-buttons reads this file before /etc/tsx/buttons.conf. A line in
# buttons.conf replaces the same setting or the same key of this file.
#
# The five printed keys right of the screen are zones of the touch
# controller (touch-overlay in the device tree). The kernel reports them as
# KEY_F13 (top) to KEY_F17 (bottom), the same key codes as on the xx60.
# The printed symbols are power, home, lights, up and down, top to bottom,
# the same as on the xx60 (checked on the glass). The names are
# the names of the xx60 keys. The vendor kernel reported the keys
# as KEY_BACK, KEY_HOME, KEY_MENU, KEY_VOLUMEUP and KEY_VOLUMEDOWN, top to
# bottom.
#
# The keys have no LEDs (checked on the panel), so this file has no LED
# settings. The two TLC59116 LED drivers on the board drive the light bars,
# not the keys (docs/hardware.md "Light bars").
#
# The keys have no local action. A press fires the Home Assistant event (the
# ESPHome event entity of the key and the event tsx_button) and does nothing
# else. A press on a blank screen only wakes the screen. To bind an action to
# a key, add an `on` line to /etc/tsx/buttons.conf.

# No slide along the keys. A short press fires at once.
SLIDE_STEP=0

button power  KEY_F13
button home   KEY_F14
button lights KEY_F15
button up     KEY_F16
button down   KEY_F17
