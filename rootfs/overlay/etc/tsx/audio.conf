# /etc/tsx/audio.conf: TSS-752 audio (tsx-audio of the xx50 board)
# After editing: tsx-audio init   (applies the settings below again)
#
# Kernel: sound card "tss752-aic3204" (ALSA id tss752aic3204): SSI2 ->
# TLV320AIC3204 DAC -> line out -> the amplifier of the speaker. The kernel
# turns the amplifier on with the playback stream.
# PCMs: /etc/asound.conf (default/speaker, media).

# The card id is TSX_SOUND_CARD in the board file. tsx-audio card prints it.
# seconds to wait for the card at boot
CARD_WAIT=15
# saved mixer state (tsx-audio store writes it at shutdown)
STATE=/var/lib/tsx/asound.state

# Levels when there is no saved state, in percent of the softvol range
# (linear in dB: 100 % = 0 dB, 50 % = -25 dB, 0 % = silence). Master is the
# volume of the panel (the setup page, Home Assistant, the overlay). Media
# stays at 100 %: Music Assistant sets the music level.
MASTER_DEFAULT=50
MEDIA_DEFAULT=100
# Master while the Sendspin player runs ("tsx-audio fixed", at each start of
# the service tsx-sendspin). The player volume of Music Assistant is then the
# volume of the panel: player 100 % is Master at this level. 100 % = 0 dB,
# so the player has the full range up to the speaker cap below.
MASTER_SENDSPIN=100

# The codec gains, set at every init (after the saved state). They are the
# cap of the speaker (see asound.conf, "Speaker safety").
# DAC "PCM": raw steps of 0.5 dB, 127 = 0 dB, 115 = -6 dB.
CODEC_PCM=115
# "LO Driver Gain": raw steps of 1 dB, 6 = 0 dB (the vendor uses 26 = +20 dB).
CODEC_LO_GAIN=6
