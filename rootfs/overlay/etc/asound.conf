# /etc/asound.conf: TSS-752 audio (kernel sound card "tss752-aic3204", ALSA
# id tss752aic3204). The TLV320AIC3204 codec on a simple-audio-card: SSI2 ->
# AUDMUX -> codec DAC -> line out (LOL/LOR) -> the amplifier of the speaker.
# One playback device, 48 kHz, S16_LE, stereo. The codec is the I2S master.
#   hw:tss752aic3204,0  playback (and the digital microphone, not used here)
#
# dmix shares the one playback device among all users of the panel: the
# Sendspin player (user tsx-sendspin), the panel app (user tsx-panel-app)
# and later the voice features. ipc_perm 0666 and ipc_key_add_uid false let
# the users of other uids join the same dmix.
#
# PCMs for applications:
#   default / speaker  -> "Master" softvol -> dmix   (sounds, TTS)
#   media              -> "Media" softvol -> Master  (Sendspin: a voice feature
#                         can turn the music down with Media)
#
# Volume: the panel has one volume. While the Sendspin player runs, it is
# the player volume of Music Assistant (sendspin-cli scales the stream by
# (volume/100)^1.5), and "Master" stays at its fixed level (MASTER_SENDSPIN
# of /etc/tsx/audio.conf, 100 % = 0 dB). Without the player, "Master" is the
# volume of the panel. In both cases the setup page, the Home Assistant
# number "Volume" of the panel app, its settings overlay and tsx-panelctl
# set the volume of the panel. Master is linear in dB: 100 % = 0 dB, 50 % =
# -25 dB, 1 % = -50 dB, 0 % = silence (softvol has no switch). tsx-audio
# keeps Media at 100 %.
#
# Speaker safety: tsx-audio sets the codec at each start: DAC "PCM" at
# -6 dB, line out "LO Driver Gain" at 0 dB. The vendor firmware drives the
# line out at +20 dB. So a full-scale sample at Master 100 % stays 26 dB
# below the vendor maximum.

pcm.tsx_dmix {
	type dmix
	ipc_key 50752
	ipc_key_add_uid false
	ipc_perm 0666
	slave {
		pcm "hw:tss752aic3204,0,0"
		rate 48000
		format S16_LE
		channels 2
		period_size 1024
		buffer_size 8192
	}
	bindings { 0 0 1 1 }
}

pcm.tsx_master {
	type softvol
	slave.pcm "tsx_dmix"
	control { name "Master"; card tss752aic3204 }
	min_dB -50.0
	max_dB 0.0
	resolution 101
}

pcm.tsx_media {
	type softvol
	slave.pcm "tsx_master"
	control { name "Media"; card tss752aic3204 }
	min_dB -50.0
	max_dB 0.0
	resolution 101
}

pcm.speaker {
	type plug
	slave.pcm "tsx_master"
	hint { show on; description "TSX speaker (Master volume, shared)" }
}
pcm.media {
	type plug
	slave.pcm "tsx_media"
	hint { show on; description "TSX speaker for music (Media + Master volume)" }
}

pcm.!default {
	type plug
	slave.pcm "tsx_master"
}
ctl.!default { type hw; card tss752aic3204 }

# Opening these PCMs creates the "Master" and "Media" controls on the card
# without touching the hardware (tsx-audio opens them at boot, before it
# restores the levels). The parameters must stay identical to tsx_master and
# tsx_media above.
pcm.tsx_master_ctl {
	type softvol
	slave.pcm "null"
	control { name "Master"; card tss752aic3204 }
	min_dB -50.0
	max_dB 0.0
	resolution 101
}
pcm.tsx_media_ctl {
	type softvol
	slave.pcm "null"
	control { name "Media"; card tss752aic3204 }
	min_dB -50.0
	max_dB 0.0
	resolution 101
}
