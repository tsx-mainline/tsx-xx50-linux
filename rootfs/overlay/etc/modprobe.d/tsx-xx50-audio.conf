# TSS-752 audio: load the speaker amplifier driver before the codec driver.
# The amplifier driver turns the amplifier off when it loads. The codec
# driver resets the codec and powers up its supply when it loads. With the
# amplifier on, these steps pop in the speaker.
softdep snd_soc_tlv320aic32x4_i2c pre: snd_soc_simple_amplifier
